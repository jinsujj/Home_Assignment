server {
  listen 80;
  root /usr/share/nginx/html;

  # The API answers in seconds when it has to page through ClinicalTrials.gov.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }

  location / {
    try_files $uri /index.html;
  }
}
