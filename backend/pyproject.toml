[project]
name = "cheiron"
version = "0.1.0"
description = "ClinicalTrials.gov query-to-visualization agent"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cheiron"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real ClinicalTrials.gov API (deselect with -m 'not live')"]
addopts = "-m 'not live'"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "pytest>=9.1.1",
]
